<!DOCTYPE html>
<html>
<head>
<title>Jarvis 2.0</title>

<style>
body {
    background: linear-gradient(135deg, #0f172a, #020617);
    color: white;
    font-family: 'Poppins', sans-serif;
}

.chat-box {
    height: 80vh;
    overflow-y: auto;
    padding: 10px;
}

.msg {
    padding: 10px;
    margin: 10px;
    border-radius: 10px;
    max-width: 70%;
}

.user {
    background: #2563eb;
    margin-left: auto;
}

.bot {
    background: #1e293b;
}

input {
    width: 80%;
    padding: 12px;
    border-radius: 10px;
    border: none;
}

button {
    padding: 12px;
    border: none;
    border-radius: 10px;
    background: #22c55e;
    color: white;
}
</style>

</head>

<body>

<h2 style="text-align:center;">🤖 Jarvis 2.0</h2>

<div class="chat-box" id="chat"></div>

<div style="display:flex;">
    <input id="msg" placeholder="Ask anything...">
    <button onclick="send()">Send</button>
</div>

<script>
async function send() {
    let msg = document.getElementById("msg").value;

    let res = await fetch("/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({msg})
    });

    let data = await res.json();

    document.getElementById("chat").innerHTML += 
        `<div class='msg user'>${msg}</div>`;
    document.getElementById("chat").innerHTML += 
        `<div class='msg bot'>${data.reply}</div>`;
}
</script>

</body>
</html>
