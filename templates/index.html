<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width">
<style>
body{background:#020617;color:white;font-family:sans-serif;}
.chat{height:75vh;overflow:auto;padding:10px;}
.msg{padding:10px;margin:5px;border-radius:10px;max-width:70%;}
.user{background:#2563eb;margin-left:auto;}
.bot{background:#1e293b;}
input{width:65%;padding:10px;}
button{padding:10px;}
.premium{position:fixed;top:10px;right:10px;}
</style>
</head>

<body>

<button class="premium" onclick="premium()">💎 Premium</button>

<div id="chat" class="chat"></div>

<input id="t" placeholder="Type your message...">
<button onclick="send()">Send</button>
<button onclick="voice()">🎤</button>
<button onclick="img()">🎨</button>

<script>
function add(t,c){
let d=document.createElement("div")
d.className="msg "+c
d.innerText=t
chat.appendChild(d)
}

async function send(){
let m=t.value
if(!m) return;

add(m,"user")

let r=await fetch("/chat",{method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({message:m})})

let d=await r.json()
add(d.reply,"bot")
t.value=""
}

function voice(){
let r=new webkitSpeechRecognition()
r.onresult=e=>{t.value=e.results[0][0].transcript}
r.start()
}

async function img(){
let r=await fetch("/generate-image",{method:"POST",
headers:{"Content-Type":"application/json"},
body:JSON.stringify({prompt:t.value})})
let d=await r.json()

let i=document.createElement("img")
i.src=d.url
i.style.width="200px"
chat.appendChild(i)
}

function premium(){
window.open("https://instagram.com/iamhasan_1122")
}
</script>

</body>
</html>
